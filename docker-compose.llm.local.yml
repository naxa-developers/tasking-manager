name: tasking-manager-llm

volumes:
  llm-models:
    name: tm-llm-models
  embedding-models:
    name: tm-embedding-models

networks:
  tm-net:
    name: tm-net

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_TAG:-server}
    container_name: tm-llm
    command:
      - --port
      - "8000"
      - --hf-repo
      - ggml-org/Qwen3-4B-GGUF
      - --hf-file
      - Qwen3-4B-Q4_K_M.gguf
      - -c
      - "16384"
      - --parallel
      - "1"
      - --threads
      - "4"
      - --load-mode
      - mlock
    restart: unless-stopped
    # Host access for the standalone lab eval (backend uses llm:8000 on tm-net).
    ports:
      - "8000:8000"
    memswap_limit: 6G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      retries: 5
      start_period: 60s
      timeout: 5s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=false"
    volumes:
      - llm-models:/root/.cache/huggingface
    networks:
      - tm-net

  embedding:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_TAG:-server}
    container_name: tm-embedding
    command:
      - --port
      - "8001"
      - -hf
      - unsloth/embeddinggemma-2-GGUF:Q8_0
      - --embedding
      - --pooling
      - mean
      - --no-mmproj
      - -c
      - "1024"
      - --batch-size
      - "1024"
      - --ubatch-size
      - "1024"
      - --parallel
      - "1"
      - --threads
      - "1"
      - --load-mode
      - mlock
    restart: unless-stopped
    memswap_limit: 2G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 10s
      retries: 5
      start_period: 60s
      timeout: 5s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=false"
    volumes:
      - embedding-models:/root/.cache/huggingface
    networks:
      - tm-net
